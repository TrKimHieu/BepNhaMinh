name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'packages/shared/**'
      - 'infrastructure/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger Render deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Kích hoạt Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK_URL}" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK_URL chưa được cấu hình trong GitHub."
            exit 1
          fi

          echo "→ Trigger deploy service 'bepnhaminh-api' trên Render..."
          curl -fL -X POST "${RENDER_DEPLOY_HOOK_URL}"
          echo "✓ Deploy task đã được trigger. Render sẽ: build image (backend/Dockerfile) → chạy release phase (prisma migrate) → start server."
