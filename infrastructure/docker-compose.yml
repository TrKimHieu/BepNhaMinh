# Production trên EC2 — chạy: docker compose -f infrastructure/docker-compose.yml up -d
#
# Secret KHÔNG nằm trong repo. deploy.sh ghi file .env này từ GitHub Actions secrets
# trước khi gọi `docker compose up`.
name: bepnhaminh

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certs:/etc/letsencrypt:ro
    depends_on:
      - api

  api:
    image: ${API_IMAGE:-ghcr.io/change-me/bepnhaminh/api:latest}
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - '3000'
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  certs:
