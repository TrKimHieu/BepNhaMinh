upstream bep_api {
  server api:3000;
  keepalive 32;
}

server {
  listen 80;
  server_name api.bepnhaminh.app;

  # Ảnh món ăn đi thẳng lên S3 bằng presigned URL, nên giới hạn ở đây khá nhỏ.
  client_max_body_size 2m;

  # Chặn theo IP cho endpoint auth — bổ sung rate limit thật ở tầng app.
  location /api/v1/auth/ {
    proxy_pass http://bep_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }

  location / {
    proxy_pass http://bep_api;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }

  # Cho phép healthcheck nội bộ từ instance
  location = /nginx-health {
    access_log off;
    return 200 "ok\n";
  }
}

