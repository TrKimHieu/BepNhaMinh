  <path d="M60 26 C57 32, 63 38, 60 45" stroke="#FFF7ED" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9" />
  <path d="M72 30 C69 35, 75 40, 72 45" stroke="#FFF7ED" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9" />

  <!-- Pot Lid / Top Rim -->
  <path d="M34 54 C34 51.7909 35.7909 50 38 50 H82 C84.2091 50 86 51.7909 86 54 C86 56.2091 84.2091 58 82 58 H38 C35.7909 58 34 56.2091 34 54 Z" fill="#FFF7ED" />

  <!-- Pot Body -->
  <path d="M38 58 L42 82 C42.6 86.8 46.7 90 51.5 90 H68.5 C73.3 90 77.4 86.8 78 82 L82 58 Z" fill="#FFF7ED" />

  <!-- Pot Handles -->
